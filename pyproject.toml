[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn"
version = "0.1.0"
description = "Telco customer churn prediction (Random Forest + SMOTE) reproducing the numbers in the README"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]